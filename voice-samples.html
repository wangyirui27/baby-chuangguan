<script>
const data = JSON.parse(document.getElementById('voice-data').textContent);
const esc = (value) => String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const size = (bytes) => bytes > 1024 ? (bytes / 1024).toFixed(1) + ' KB' : bytes + ' B';
const total = data.libraries.reduce((sum, lib) => sum + lib.entries.length, 0);
document.getElementById('total').textContent = total + ' 个可试听音色';
document.getElementById('nav').innerHTML = data.libraries.map((lib) => '<a href="#' + esc(lib.id) + '">' + esc(lib.title) + ' · ' + lib.entries.length + '</a>').join('');
document.getElementById('content').innerHTML = data.libraries.map((lib) => {
  const groups = lib.entries.map((entry) => entry.group).filter((group, index, arr) => arr.indexOf(group) === index);
  const failed = (lib.failed || []).length ? '<div class="notice">未放入试听页：' + lib.failed.map((item) => esc(item.name || item.speaker) + (item.error ? '（' + esc(item.error) + '）' : '')).join('；') + '</div>' : '';
  const sections = groups.map((group) => {
    const cards = lib.entries.filter((entry) => entry.group === group).map((entry) => '<article>' +
      '<div class="name"><span>' + esc(entry.name) + '</span><span class="tag">' + esc(entry.note || entry.group) + '</span></div>' +
      '<code>' + esc(entry.speaker) + '</code>' +
      '<div class="style">' + esc(entry.style || entry.group) + '</div>' +
      '<audio controls preload="metadata" src="' + esc(entry.url) + '"></audio>' +
      '<div class="size">' + size(entry.size_bytes || 0) + '</div>' +
      '</article>').join('');
    return '<h3>' + esc(group) + '</h3><div class="grid">' + cards + '</div>';
  }).join('');
  return '<section id="' + esc(lib.id) + '"><h2>' + esc(lib.title) + '</h2><div class="meta">' + esc(lib.subtitle) + '</div><p class="sample">试听文本：' + esc(lib.sample_text) + '</p>' + failed + sections + '</section>';
}).join('');
document.addEventListener('play', (event) => {
  if (event.target.tagName !== 'AUDIO') return;
  document.querySelectorAll('audio').forEach((audio) => { if (audio !== event.target) audio.pause(); });
}, true);
</script>
