<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>埃及地图第一关预览</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e9b765;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }

    .preview {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background: #edc070;
    }

    .desert-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .level-stop {
      position: absolute;
      left: 20.5%;
      top: 39%;
      width: min(27vw, 430px);
      min-width: 230px;
      aspect-ratio: 1.16;
      z-index: 3;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 18px 20px rgba(120, 65, 23, .24));
    }

    .level-stop img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .level-badge {
      position: absolute;
      left: 50%;
      bottom: 6%;
      display: grid;
      place-items: center;
      width: clamp(46px, 5vw, 72px);
      height: clamp(46px, 5vw, 72px);
      transform: translateX(-50%);
      border-radius: 999px;
      border: 5px solid #fff4cf;
      background:
        radial-gradient(circle at 35% 30%, #fff9c5 0 16%, #ffd852 34%, #f2a923 68%, #c7741a 100%);
      color: #6d3a10;
      font-size: clamp(22px, 2.8vw, 36px);
      font-weight: 900;
      box-shadow: 0 9px 0 rgba(128, 67, 18, .28), 0 0 0 3px rgba(145, 74, 15, .18);
    }

    .sand-cover {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28%;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(229, 171, 82, 0) 0%, #e3aa57 16%, #dfa050 100%);
    }

    .camel-rider {
      position: absolute;
      left: 52%;
      bottom: 1.5%;
      width: min(31vw, 560px);
      min-width: 280px;
      transform: translateX(-50%);
      z-index: 4;
      filter: drop-shadow(0 14px 12px rgba(109, 63, 22, .18));
      animation: camel-idle 3.8s ease-in-out infinite;
    }

    .camel-rider img {
      display: block;
      width: 100%;
      height: auto;
    }

    .top-chip {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 22px;
      background: rgba(255, 244, 207, .72);
      color: #754010;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(118, 69, 23, .18);
      backdrop-filter: blur(12px);
    }

    .top-chip span {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffd75a;
      box-shadow: inset 0 -3px 0 rgba(144, 84, 12, .18);
    }

    @keyframes camel-idle {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-3px); }
    }

    @media (max-width: 720px) {
      .level-stop {
        left: 28%;
        top: 43%;
        min-width: 180px;
        width: 40vw;
      }

      .camel-rider {
        left: 55%;
        bottom: 2%;
        min-width: 235px;
        width: 46vw;
      }
    }
  </style>
</head>
<body>
  <main class="preview" aria-label="埃及沙漠第一关地图预览">
    <video class="desert-video" autoplay muted loop playsinline preload="auto" poster="assets/egypt-map/background/egypt-desert-infinite-clean-bg-dreamina-v2.png?v=20260720-desert-infinite-v2">
      <source src="assets/egypt-map/background/egypt-desert-infinite-bg-libtv-v2.mp4?v=20260720-desert-infinite-v2" type="video/mp4">
    </video>

    <div class="top-chip" aria-hidden="true"><span>1</span> Pyramid</div>

    <button class="level-stop" type="button" aria-label="第 1 关 Pyramid">
      <img src="assets/egypt-map/cutouts/stickers/blend/pyramid.webp" alt="">
      <strong class="level-badge">1</strong>
    </button>

    <div class="sand-cover" aria-hidden="true"></div>

    <div class="camel-rider" aria-hidden="true">
      <img src="assets/egypt-map/cutouts/characters/dreamina/children-on-camel-safari-handpainted-v2.png" alt="">
    </div>
  </main>
</body>
</html>
