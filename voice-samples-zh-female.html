<script>
var data = JSON.parse(document.getElementById('voice-data').textContent);
var esc = function(value) { return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
var size = function(bytes) { return bytes > 1024 ? (bytes / 1024).toFixed(1) + ' KB' : bytes + ' B'; };
var groups = data.entries.map(function(entry) { return entry.group; }).filter(function(group, index, arr) { return arr.indexOf(group) === index; });

document.getElementById('count').textContent = data.entries.length + ' 个可试听音色';
document.getElementById('sample').textContent = '试听文本：' + data.sample_text;
if (data.failed.length) {
  document.getElementById('notice').innerHTML = '<div class="notice">未放入试听页：' + data.failed.map(function(v) { return esc(v.name) + '（' + esc(v.error) + '）'; }).join('；') + '</div>';
}

document.getElementById('groups').innerHTML = groups.map(function(group) {
  var cards = data.entries.filter(function(entry) { return entry.group === group; }).map(function(entry) {
    return '<article>' +
      '<div class="name"><span>' + esc(entry.name) + '</span><span class="note">' + esc(entry.note) + '</span></div>' +
      '<code>' + esc(entry.speaker) + '</code>' +
      '<div class="style">' + esc(entry.style) + '</div>' +
      '<audio controls preload="metadata" src="' + esc(entry.url) + '"></audio>' +
      '<div class="size">' + size(entry.size_bytes) + ' · ' + esc((entry.sha256 || '').slice(0, 12)) + '</div>' +
      '</article>';
  }).join('');
  return '<section><h2>' + esc(group) + '</h2><div class="grid">' + cards + '</div></section>';
}).join('');

document.addEventListener('play', function(event) {
  if (event.target.tagName !== 'AUDIO') return;
  document.querySelectorAll('audio').forEach(function(audio) { if (audio !== event.target) audio.pause(); });
}, true);
</script>
