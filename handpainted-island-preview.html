<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>手绘海岛地图预览</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #8bd8dc;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }

    .preview {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background: url("assets/handpainted-island/preview/ocean-bg-handpainted-v3-horizon.jpg") center / cover;
    }

    .preview::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(36, 149, 170, .08));
      mix-blend-mode: soft-light;
    }

    .level-stop {
      position: absolute;
      left: 34%;
      top: 44%;
      width: min(39vw, 610px);
      min-width: 320px;
      transform: translate(-50%, -50%);
      z-index: 2;
      border: 0;
      background: transparent;
      padding: 0;
      filter: drop-shadow(0 16px 14px rgba(36, 107, 93, .20));
    }

    .level-stop img,
    .boat img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .level-badge {
      position: absolute;
      left: 50%;
      bottom: 24%;
      display: grid;
      place-items: center;
      width: clamp(48px, 5vw, 72px);
      height: clamp(48px, 5vw, 72px);
      transform: translateX(-50%);
      border-radius: 999px;
      border: 5px solid #fff3c2;
      background: #f5bd35;
      color: #6e4212;
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 900;
      box-shadow: 0 8px 0 rgba(99, 89, 32, .22);
    }

    .boat {
      position: absolute;
      left: 56%;
      bottom: 10%;
      width: min(25vw, 390px);
      min-width: 245px;
      transform: translateX(-50%);
      z-index: 3;
      filter: drop-shadow(0 13px 12px rgba(28, 94, 102, .20));
      animation: boat-idle 3.4s ease-in-out infinite;
    }

    .chip {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 22px;
      background: rgba(255, 246, 202, .78);
      color: #6c4c16;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(43, 117, 120, .16);
      backdrop-filter: blur(12px);
    }

    .chip span {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f7c84a;
    }

    @keyframes boat-idle {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(-1deg); }
      50% { transform: translateX(-50%) translateY(-5px) rotate(1deg); }
    }

    @media (max-width: 720px) {
      .level-stop {
        left: 38%;
        top: 45%;
        min-width: 240px;
        width: 48vw;
      }

      .boat {
        left: 57%;
        bottom: 13%;
        min-width: 210px;
        width: 42vw;
      }
    }
  </style>
</head>
<body>
  <main class="preview" aria-label="手绘海岛地图预览">
    <div class="chip" aria-hidden="true"><span>1</span> Island</div>

    <button class="level-stop" type="button" aria-label="第 1 关 Island">
      <img src="assets/handpainted-island/preview/island-001-online-alpha-fade-handpainted-v8b.png" alt="">
      <strong class="level-badge">1</strong>
    </button>

    <div class="boat" aria-hidden="true">
      <img src="assets/handpainted-island/preview/boat-kids-rowing-online-angle-handpainted-v6-flood.png" alt="">
    </div>
  </main>
</body>
</html>
